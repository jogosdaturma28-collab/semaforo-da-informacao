<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFO•TRAFFIC - Senac</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}
body{background:#0A0E21;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:32px;font-weight:800;letter-spacing:4px;background:linear-gradient(90deg, #FF2D55, #FFD60A, #00FF88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.traffic{width:150px;background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:14px}
.light{width:100%;aspect-ratio:1;border-radius:50%}
.red{background:#FF2D55;box-shadow:0 0 25px #FF2D55}
.yellow{background:#FFD60A;box-shadow:0 0 25px #FFD60A}
.green{background:#00FF88;box-shadow:0 0 25px #00FF88}
.light.off{opacity:0.18;filter:grayscale(1)}
.card{width:100%;max-width:400px;background:rgba(255,255,255,0.1);backdrop-filter:blur(25px);border-radius:24px;padding:20px;margin-top:25px}
.opt{width:100%;padding:14px;border-radius:14px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);margin-bottom:10px;display:flex;gap:12px;color:white;text-align:left}
.btn{width:100%;padding:16px;background:linear-gradient(90deg, #FF2D55, #FFD60A, #00FF88);border:none;border-radius:16px;color:#0A0E21;font-weight:800;margin-top:12px}
.footer{margin-top:30px;display:flex;gap:10px;opacity:0.9}
.senac{font-weight:800;font-size:22px;color:#004A8D;background:white;padding:2px 10px;border-radius:6px}
</style>
</head>
<body>
<h1>SEMÁFORO</h1>
<div style="font-size:12px;letter-spacing:3px;color:#8A9CC5;margin-bottom:20px">DA INFORMAÇÃO</div>
<div class="traffic"><div class="light red" id="l1"></div><div class="light yellow off" id="l2"></div><div class="light green off" id="l3"></div></div>
<div class="card"><div id="badge" style="background:#FFD60A;color:#0A0E21;padding:5px 14px;border-radius:20px;font-size:10px;display:inline-block;margin-bottom:12px;font-weight:800">PERGUNTA 1/5</div><div id="question" style="font-weight:700;margin-bottom:16px"></div><div id="opts"></div><button class="btn" id="next" style="display:none" onclick="next()">PRÓXIMA</button></div>
<div class="footer"><div class="senac">Senac</div><span style="font-size:11px;color:#8A9CC5">Conhecimento Seguro</span></div>
<script>
const data=[{q:"Título em CAPS LOCK e muitos emojis, o que fazer?",o:["Compartilhar","Verificar fonte oficial","Comentar"],c:1},{q:"Fonte MAIS confiável para saúde?",o:["Blog anônimo","Site oficial Ministério da Saúde","Print WhatsApp"],c:1},{q:"O que é fact-checking?",o:["Aumentar alcance","Verificar veracidade","Criar manchete"],c:1},{q:"Mensagem 'Encaminhada com frequência', você:",o:["Encaminha","Desconfia e verifica","Apaga"],c:1},{q:"Para combater fake news:",o:["Só crer no que gosta","Checar data, fonte e contexto","Compartilhar rápido"],c:1}];
let i=0,s=0;
function setLight(t){document.getElementById('l1').className='light red '+(t==='red'?'':'off');document.getElementById('l2').className='light yellow '+(t==='yellow'?'':'off');document.getElementById('l3').className='light green '+(t==='green'?'':'off');}
function load(){document.getElementById('badge').innerText=`PERGUNTA ${i+1}/5`;document.getElementById('question').innerText=data[i].q;document.getElementById('opts').innerHTML=data[i].o.map((t,k)=>`<button class="opt" onclick="check(${k})"><div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-weight:800">${String.fromCharCode(65+k)}</div>${t}</button>`).join('');document.getElementById('next').style.display='none';setLight('yellow');}
function check(k){const b=document.querySelectorAll('.opt');b.forEach(x=>x.style.pointerEvents='none');if(k===data[i].c){b[k].style.borderColor='#00FF88';b[k].style.background='rgba(0,255,136,0.2)';s++;setLight('green');}else{b[k].style.borderColor='#FF2D55';b[data[i].c].style.borderColor='#00FF88';setLight('red');}document.getElementById('next').style.display='block';document.getElementById('next').innerText=i===data.length-1?`RESULTADO (${s}/${data.length})`:'PRÓXIMA';}
function next(){i++;if(i<data.length)load();else{alert(`Você fez ${s}/${data.length}!`);i=0;s=0;load();}}
load();
</script>
</body>
</html>
